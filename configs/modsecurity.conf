# ModSecurity Configuration File (Sanitized Sample)
# Path on server: /etc/modsecurity/modsecurity.conf

# ------------------------------------------------------------------
# Rule Engine Configuration
# ------------------------------------------------------------------
# Enable active rule engine enforcement to actively block attacks
SecRuleEngine On

# Enable request body processing for inspection
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# ------------------------------------------------------------------
# Audit Log Configuration
# ------------------------------------------------------------------
# Log transactions marked by rules or returning error status codes
SecAuditEngine On
# SecAuditLogRelevantStatus "^(?:5|4(?!04))"

# Log all key request/response parts
SecAuditLogParts ABDEFHIJZ

# Audit Log Storage & Path
SecAuditLogType Serial
SecAuditLog /var/log/apache2/modsec_audit.log

# Include OWASP Core Rule Set (CRS)
Include /etc/modsecurity/crs/crs-setup.conf
Include /etc/modsecurity/crs/rules/*.conf